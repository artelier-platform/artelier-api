#################################
# APPLICATION
#################################

spring.application.name=${APP_NAME}
server.port=${SERVER_PORT}

#################################
# DATABASE
#################################

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000

#################################
# JPA & HIBERNATE
#################################

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

#################################
# FLYWAY MIGRATIONS
#################################

spring.flyway.enabled=${FLYWAY_ENABLED}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public

#################################
# JWT SECURITY
#################################

jwt.secret=${JWT_SECRET}
jwt.key.id=${JWT_KEY_ID}
app.jwt.issuer=${JWT_ISSUER}
jwt.expiration-ms=${JWT_EXPIRATION_MS}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS}

#################################
# CLOUDINARY (MEDIA STORAGE)
#################################

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

#################################
# CORS
#################################

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

#################################
# SWAGGER / OPENAPI
#################################

springdoc.api-docs.enabled=${SWAGGER_ENABLED}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED}
springdoc.swagger-ui.path=/swagger

#################################
# SPRING ACTUATOR
#################################

management.endpoints.web.exposure.include=${ACTUATOR_EXPOSE}
management.endpoint.health.show-details=never

#################################
# FILE UPLOAD LIMITS
#################################

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

#################################
# LOGGING
#################################

logging.level.root=INFO
logging.level.org.springframework.security=INFO

#################################
# WOMPI (PAYMENT GATEWAY)
#################################

wompi.events-key=${WOMPI_EVENTS_KEY}
wompi.public-key=${WOMPI_PUBLIC_KEY}
wompi.private-key=${WOMPI_PRIVATE_KEY}
wompi.integrity-secret=${WOMPI_INTEGRITY_SECRET}
wompi.base-url=${WOMPI_BASE_URL}
wompi.redirect-url=${WOMPI_REDIRECT_URL}

#################################
# BREVO (EMAIL SERVICE)
#################################
brevo.base-url=${BREVO_BASE_URL:https://api.brevo.com}
brevo.api.key=${BREVO_API_KEY}

# Remitente por defecto
brevo.sender.name=${BREVO_SENDER_NAME:Artelier Cajica}
brevo.sender.email=${BREVO_SENDER_EMAIL:arteliercajica@gmail.com}

# IDs de Plantillas Transaccionales
brevo.templates.auth-verification=${BREVO_TEMPLATE_AUTH_VERIFICATION}


#################################
# CAFFEINE (IN-MEMORY CACHE)
#################################

spring.cache.caffeine.spec=maximumSize=${CAFFEINE_MAXIMUM_SIZE},expireAfterWrite=${CAFFEINE_EXPIRE_AFTER_WRITE}

#################################
# REDIS (DISTRIBUTED CACHE)
#################################

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
